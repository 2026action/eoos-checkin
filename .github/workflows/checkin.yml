# EOOS.TOP 每日自动签到 (带Token持久化)
# 每天 UTC 00:00 (北京时间 08:00) 执行
# 首次运行会登录并保存token到GitHub Variable, 后续复用免登录
#
# 需要设置 Secrets:
#   EOOS_USERNAME - 用户名
#   EOOS_PASSWORD - 密码
#   GH_PAT        - GitHub Personal Access Token (用于更新token变量, 需repo权限)
#
# 需要设置 Variables:
#   EOOS_TOKEN    - 登录token (脚本自动维护, 首次无需手动设置)

name: EOOS Check-in

on:
  schedule:
    # 错峰: 避开 UTC 整点(全球高峰), 用奇数分钟排队更快
    - cron: '17 0 * * *'   # 北京 08:17 首次尝试
    - cron: '37 1 * * *'   # 北京 09:37 兜底1 (脚本会检测"已签到"自动跳过)
    - cron: '17 3 * * *'   # 北京 11:17 兜底2
  workflow_dispatch:       # 手动触发

# 防止定时+手动并发执行
concurrency:
  group: eoos-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run check-in
        id: checkin
        env:
          EOOS_USERNAME: ${{ secrets.EOOS_USERNAME }}
          EOOS_PASSWORD: ${{ secrets.EOOS_PASSWORD }}
          EOOS_COOKIE: ${{ vars.EOOS_TOKEN }}
        run: |
          python scripts/checkin_eoos.py 2>&1 | tee /tmp/checkin_output.txt

      - name: Update token variable (if new token generated)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 取最后一次出现的 __NEW_TOKEN__= 行，避免多次打印取错
          NEW_TOKEN=$(grep -oP '__NEW_TOKEN__=\K.*' /tmp/checkin_output.txt | tail -n 1 || echo "")
          if [ -n "$NEW_TOKEN" ]; then
            # 掩码防止后续步骤/日志泄漏
            echo "::add-mask::$NEW_TOKEN"
            echo "🔄 更新token变量..."
            # 使用 --data-urlencode 风格构造 JSON，避免特殊字符破坏
            PAYLOAD=$(python3 -c "import json,os;print(json.dumps({'name':'EOOS_TOKEN','value':os.environ['NT']}))" )
            HTTP_CODE=$(NT="$NEW_TOKEN" curl -s -w "%{http_code}" -o /dev/null -X PATCH \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables/EOOS_TOKEN" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            if [ "$HTTP_CODE" = "204" ]; then
              echo "✅ Token已更新"
            else
              echo "❌ 更新失败 (HTTP $HTTP_CODE)"
              exit 1
            fi
          else
            echo "ℹ️ 无需更新token"
          fi
