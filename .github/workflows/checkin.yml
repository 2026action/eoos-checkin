# EOOS.TOP 每日自动签到 (带Token持久化 + TG通知 + 日志自动清理)
#
# 需要设置 Secrets:
#   EOOS_USERNAME - 用户名
#   EOOS_PASSWORD - 密码
#   GH_PAT        - GitHub PAT (repo + workflow 权限, 用于更新 Variable / 清理 run 日志)
#   TG_BOT_TOKEN  - Telegram Bot Token (可选, 未设置则不发通知)
#   TG_CHAT_ID    - Telegram Chat ID   (可选, 未设置则不发通知)
#
# 需要设置 Variables:
#   EOOS_TOKEN    - 登录token (脚本自动维护, 首次无需手动设置)

name: EOOS Check-in

on:
  schedule:
    # 错峰: 避开 UTC 整点(全球高峰), 用奇数分钟排队更快
    - cron: '17 0 * * *'   # 北京 08:17 首次尝试
    - cron: '37 1 * * *'   # 北京 09:37 兜底1 (脚本会检测"已签到"自动跳过)
    - cron: '17 3 * * *'   # 北京 11:17 兜底2
  workflow_dispatch:       # 手动触发

concurrency:
  group: eoos-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run check-in
        id: checkin
        env:
          EOOS_USERNAME: ${{ secrets.EOOS_USERNAME }}
          EOOS_PASSWORD: ${{ secrets.EOOS_PASSWORD }}
          EOOS_COOKIE: ${{ vars.EOOS_TOKEN }}
        run: |
          set -o pipefail
          python scripts/checkin_eoos.py 2>&1 | tee /tmp/checkin_output.txt
          RC=${PIPESTATUS[0]}
          echo "签到脚本退出码: $RC"
          exit $RC

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-debug-${{ github.run_id }}
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Update token variable (if new token generated)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN=$(grep -oP '__NEW_TOKEN__=\K.*' /tmp/checkin_output.txt 2>/dev/null | tail -n 1 || echo "")
          if [ -n "$NEW_TOKEN" ]; then
            echo "::add-mask::$NEW_TOKEN"
            echo "🔄 更新token变量..."
            PAYLOAD=$(NT="$NEW_TOKEN" python3 -c "import json,os;print(json.dumps({'name':'EOOS_TOKEN','value':os.environ['NT']}))")
            HTTP_CODE=$(NT="$NEW_TOKEN" curl -s -w "%{http_code}" -o /dev/null -X PATCH \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables/EOOS_TOKEN" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            if [ "$HTTP_CODE" = "204" ]; then
              echo "✅ Token已更新"
            else
              echo "❌ 更新失败 (HTTP $HTTP_CODE)"
              exit 1
            fi
          else
            echo "ℹ️ 无需更新token"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS:   ${{ job.status }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME:   ${{ github.event_name }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "ℹ️ 未配置 TG_BOT_TOKEN/TG_CHAT_ID, 跳过通知"
            exit 0
          fi

          # 从脚本输出提取关键信息
          STATUS_LINE=$(grep -oP '状态: \K.*' /tmp/checkin_output.txt 2>/dev/null | tail -n 1 || echo "")
          REWARD_LINE=$(grep -oP '奖励: \K.*' /tmp/checkin_output.txt 2>/dev/null | tail -n 1 || echo "")

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"
            TITLE="EOOS 签到成功"
          else
            EMOJI="❌"
            TITLE="EOOS 签到失败"
          fi

          # 北京时间
          BJ_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')

          # 构造消息 (HTML 模式, 由 scripts/build_tg_message.py 生成)
          export EMOJI TITLE BJ_TIME EVENT_NAME STATUS_LINE REWARD_LINE RUN_URL
          MSG=$(python3 scripts/build_tg_message.py)

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" \
            -o /tmp/tg_resp.json -w "HTTP %{http_code}\n"
          cat /tmp/tg_resp.json | python3 -c "import sys,json;d=json.load(sys.stdin);print('TG ok=',d.get('ok'),'desc=',d.get('description',''))" || true

      - name: Cleanup old workflow runs (keep latest 2)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          WF_NAME: ${{ github.workflow }}
          CUR_RUN: ${{ github.run_id }}
        run: |
          echo "🧹 清理旧运行记录, 只保留最近 2 条..."
          # 拉取当前 workflow 的所有 run (最多 100 条足够)
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs?per_page=100" > /tmp/runs.json

          # 用 python 挑出该 workflow 下、除当前 run 外、按时间倒序、保留最新 1 条 (加上当前正在跑的这条 = 共 2 条)
          IDS=$(CUR="$CUR_RUN" WF="$WF_NAME" KEEP=1 python3 scripts/cleanup_old_runs.py)

          if [ -z "$IDS" ]; then
            echo "ℹ️ 无需清理"
          else
            echo "$IDS" | while read rid; do
              [ -z "$rid" ] && continue
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$rid")
              echo "  删除 run $rid -> HTTP $CODE"
            done
          fi
